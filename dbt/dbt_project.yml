name: dataforge
version: "1.0.0"
config-version: 2
profile: dataforge

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # look-back window (days) re-processed by incremental marts to absorb late-arriving updates
  incremental_lookback_days: 7
  # a product is "declining" when its last-90-day revenue is below this share of the prior 90 days
  declining_threshold: 0.7
  low_stock_days_of_cover: 14

models:
  dataforge:
    +materialized: view
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
