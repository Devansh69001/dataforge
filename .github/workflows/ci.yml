name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (pytest + PySpark + PostgreSQL + dbt)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dataforge
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: dataforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dataforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: dataforge
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: dataforge
      SPARK_DRIVER_MEMORY: 2g
      DATAFORGE_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --no-deps -e .
      - name: Validate pipeline configuration
        run: |
          python -m dataforge.pipeline.runner --list
          python -c "from dataforge.pipeline.spec import validate_spec; validate_spec(); print('pipeline spec ok')"
          python -c "from dataforge.quality.suites import SUITES; print(sum(len(s.rules) for s in SUITES.values()), 'quality rules')"
      - name: Validate dbt project
        run: dbt parse --profiles-dir dbt --project-dir dbt --target ci
      - name: Run tests
        run: pytest -m "not e2e" --tb=short
      - name: End-to-end pipeline (initial -> incremental -> rerun)
        run: pytest -m e2e --tb=short
      - name: Upload run telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-run-docs
          path: |
            /tmp/pytest-of-runner/**/monitoring/runs/*.json
          if-no-files-found: ignore

  airflow-dag:
    name: Airflow DAG import
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Airflow (constrained) + runtime deps
        run: |
          pip install "apache-airflow==2.10.5" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"
          pip install -r docker/requirements-airflow.txt pytest
          # the DAG and its tests import dataforge.*; --no-deps keeps Airflow's pins intact
          pip install --no-deps -e .
      - name: Import the DAG
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: |
          airflow db migrate >/dev/null
          pytest tests/test_pipeline.py -k "airflow_dag_loads or dag_file" --tb=short -p no:cacheprovider

  docker-config:
    name: Validate docker compose
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-password/; s/^AIRFLOW_ADMIN_PASSWORD=.*/AIRFLOW_ADMIN_PASSWORD=ci-password/' .env
          docker compose config --quiet
      - name: Build application image
        run: docker build -f docker/Dockerfile.app -t dataforge/app:ci .

  docker-stack:
    name: Docker stack (up + healthchecks)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          # the airflow and application images together need more headroom than the
          # default runner image leaves free
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Write .env and open up the bind mounts
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-password/; s/^AIRFLOW_ADMIN_PASSWORD=.*/AIRFLOW_ADMIN_PASSWORD=ci-password/' .env
          # the images run as uid 1000 while the runner owns the checkout as uid 1001,
          # so the bind-mounted lake and dbt target/logs would otherwise be read-only
          mkdir -p data dbt/target dbt/logs
          chmod -R 777 data dbt

      - name: docker compose up --build
        run: docker compose up -d --build

      - name: Wait for services to become healthy
        run: |
          set -u
          deadline=$((SECONDS + 900))
          # services declaring a healthcheck must report healthy
          healthchecked="postgres reference-api api airflow-webserver"
          # no healthcheck declared: assert the container is at least running
          running="dashboard airflow-scheduler"

          for svc in $healthchecked; do
            echo "::group::waiting for $svc"
            while :; do
              cid=$(docker compose ps -q "$svc" || true)
              if [ -n "$cid" ]; then
                state=$(docker inspect -f '{{.State.Status}}' "$cid")
                health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid")
                echo "  $svc: state=$state health=$health"
                [ "$health" = "healthy" ] && break
                if [ "$state" = "exited" ]; then
                  echo "::error::$svc exited before becoming healthy"; exit 1
                fi
              fi
              if [ $SECONDS -ge $deadline ]; then
                echo "::error::timed out waiting for $svc"; exit 1
              fi
              sleep 10
            done
            echo "::endgroup::"
          done

          for svc in $running; do
            cid=$(docker compose ps -q "$svc" || true)
            state=$(docker inspect -f '{{.State.Status}}' "$cid" 2>/dev/null || echo missing)
            echo "  $svc: state=$state"
            [ "$state" = "running" ] || { echo "::error::$svc is $state, expected running"; exit 1; }
          done

          # one-shot init container must have completed successfully
          cid=$(docker compose ps -aq airflow-init)
          rc=$(docker inspect -f '{{.State.ExitCode}}' "$cid")
          echo "  airflow-init exit code: $rc"
          [ "$rc" = "0" ] || { echo "::error::airflow-init failed (exit $rc)"; exit 1; }

      - name: Probe the service health endpoints
        run: |
          set -e
          probe() {  # name url expected-substring
            echo "-- $1 ($2)"
            body=$(curl -fsS --retry 5 --retry-delay 5 --retry-connrefused --max-time 30 "$2")
            echo "$body" | head -c 200; echo
            echo "$body" | grep -q "$3" || { echo "::error::$1 response did not contain '$3'"; exit 1; }
          }
          probe "analytics API health" "http://localhost:8000/health" '"status"'
          probe "reference API health" "http://localhost:8081/health" '"status"'
          probe "airflow health"       "http://localhost:8080/health" 'metadatabase'
          echo "-- dashboard (http://localhost:8501)"
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 10 --retry-delay 5 --retry-connrefused --max-time 30 http://localhost:8501)
          echo "  HTTP $code"; [ "$code" = "200" ] || { echo "::error::dashboard returned $code"; exit 1; }
          echo "-- postgres"
          docker compose exec -T postgres pg_isready -U dataforge -d dataforge

      - name: Run the documented pipeline workflow in the containers
        run: |
          set -e
          # small scale keeps the job bounded; this exercises the real HTTP reference-API
          # source (REFERENCE_API_URL=http://reference-api:8081), which the unit tests only
          # ever reach through a mocked transport
          docker compose run --rm pipeline python scripts/generate_data.py --scale 0.02
          docker compose run --rm pipeline python -m dataforge.pipeline.runner --batch 2025-11-30
          docker compose run --rm dbt test

      - name: Probe the data-backed endpoints
        run: |
          set -e
          probe() {
            echo "-- $1 ($2)"
            body=$(curl -fsS --max-time 30 "$2")
            echo "$body" | head -c 200; echo
            echo "$body" | grep -q "$3" || { echo "::error::$1 response did not contain '$3'"; exit 1; }
          }
          # the reference API serves generated documents, so these only exist once the
          # generation step above has run
          probe "reference API regions" "http://localhost:8081/reference/regions"        '"data"'
          probe "analytics API sales"   "http://localhost:8000/metrics/sales?limit=2"    '"revenue_usd"'
          probe "pipeline status"       "http://localhost:8000/pipeline/status"          '"success"'

      - name: Verify the warehouse was populated
        run: |
          docker compose exec -T postgres psql -U dataforge -d dataforge -v ON_ERROR_STOP=1 -c "
            SELECT 'fact_orders' AS t, count(*) FROM warehouse.fact_orders
            UNION ALL SELECT 'monthly_revenue', count(*) FROM analytics_marts.monthly_revenue_summary
            UNION ALL SELECT 'successful_runs', count(*) FROM monitoring.pipeline_runs WHERE status='success';"
          docker compose exec -T postgres psql -U dataforge -d dataforge -tAc \
            "SELECT count(*) FROM warehouse.fact_orders" | grep -qvx 0 || { echo "::error::fact_orders is empty"; exit 1; }

      - name: Service status
        if: always()
        run: docker compose ps

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
