[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge"
version = "0.1.0"
description = "DataForge - production-style data engineering & analytics platform for e-commerce and inventory data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Devansh Gupta" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyspark>=3.5",
    "psycopg[binary]>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dashboard = ["streamlit>=1.32", "plotly>=5.20"]
dbt = ["dbt-core>=1.8", "dbt-postgres>=1.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["dataforge*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["dbt/target", "data", ".local"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108", "UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "spark: tests that start a local SparkSession (slow)",
    "db: tests that need a PostgreSQL database",
    "e2e: full pipeline tests",
]
filterwarnings = ["ignore::DeprecationWarning"]
